name: sistta

services:
  app:
    build: .
    image: sistta-app:latest
    container_name: sistta-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      CI_ENVIRONMENT: ${APP_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081/}
      APP_TIMEZONE: America/Lima
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS:-false}
      DB_HOST: db
      DB_NAME: sist_taxis
      DB_USER: ${DB_USER:-sistta}
      DB_PASSWORD: ${DB_PASSWORD:-sistta_secret}
      DB_PORT: 3306
    volumes:
      - sistta_writable:/var/www/html/writable
      - sistta_img:/var/www/html/public/assets/img

  db:
    image: mysql:8.0
    container_name: sistta-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: ${DB_USER:-sistta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sistta_secret}
      TZ: America/Lima
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - sistta_db:/var/lib/mysql
      - ./db/sist_taxis.sql:/docker-entrypoint-initdb.d/01-sist_taxis.sql:ro
      - ./docker/mysql/02-usuario.sh:/docker-entrypoint-initdb.d/02-usuario.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sistta_db:
  sistta_writable:
  sistta_img:
